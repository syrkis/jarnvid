# A pushed version tag publishes to PyPI through trusted publishing: PyPI trusts this workflow's
# short-lived GitHub identity, so no token is stored anywhere.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag names the version in pyproject.toml
        run: test "${GITHUB_REF_NAME}" = "v$(uv version --short)"
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
